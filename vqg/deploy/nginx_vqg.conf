server {
    listen 80;
    server_name _;

    # Allow large PDF uploads (up to 100 MB)
    client_max_body_size 100M;

    # Long timeout for file uploads + processing status polls
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── API routes → FastAPI backend (port 8000) ──────────────────────────
    location ~ ^/(upload|jobs|export|preview|health|storage)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else → Next.js frontend (port 3000) ───────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
